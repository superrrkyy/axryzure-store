<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/><stop offset=".6" stop-color="#101629"/><stop offset="1" stop-color="#1a1608"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#b8975a"/><stop offset=".5" stop-color="#f3e2b3"/><stop offset="1" stop-color="#e4cb86"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="az"><stop offset="0" stop-color="#6f87f8" stop-opacity=".45"/><stop offset="1" stop-color="#6f87f8" stop-opacity="0"/></radialGradient>
    <radialGradient id="au"><stop offset="0" stop-color="#e4cb86" stop-opacity=".25"/><stop offset="1" stop-color="#e4cb86" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="230" cy="120" r="260" fill="url(#az)"><animate attributeName="r" values="240;290;240" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="250" r="220" fill="url(#au)"><animate attributeName="r" values="240;190;240" dur="8s" repeatCount="indefinite"/></circle>
  <g stroke="#ffffff" stroke-opacity=".04">
    <path d="M0 85H1200M0 170H1200M0 255H1200M150 0V340M300 0V340M450 0V340M600 0V340M750 0V340M900 0V340M1050 0V340"/>
  </g>

  <!-- floating product cards -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5s" repeatCount="indefinite"/>
    <rect x="70" y="80" width="150" height="190" rx="18" fill="url(#card)" stroke="#6f87f8" stroke-opacity=".5"/>
    <rect x="86" y="96" width="118" height="80" rx="10" fill="#6f87f8" fill-opacity=".35"/>
    <rect x="86" y="190" width="90" height="10" rx="5" fill="#e5e7eb" fill-opacity=".7"/>
    <rect x="86" y="210" width="60" height="8" rx="4" fill="#e5e7eb" fill-opacity=".35"/>
    <text x="86" y="252" font-family="Consolas, Menlo, monospace" font-size="18" fill="#e4cb86">$29</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="6s" repeatCount="indefinite"/>
    <rect x="980" y="60" width="150" height="190" rx="18" fill="url(#card)" stroke="#e4cb86" stroke-opacity=".5"/>
    <circle cx="1055" cy="118" r="34" fill="#e4cb86" fill-opacity=".3"/>
    <path d="M1040 118l10 10 20-22" stroke="#e4cb86" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="996" y="170" width="100" height="10" rx="5" fill="#e5e7eb" fill-opacity=".7"/>
    <rect x="996" y="190" width="70" height="8" rx="4" fill="#e5e7eb" fill-opacity=".35"/>
    <text x="996" y="232" font-family="Consolas, Menlo, monospace" font-size="18" fill="#e4cb86">$49</text>
  </g>

  <text x="600" y="92" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" letter-spacing="8" fill="#8ca0fa">✦ PREMIUM DIGITAL GOODS ✦</text>
  <text x="600" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="6" fill="url(#gold)">AXRYZURE</text>
  <text x="600" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" letter-spacing="14" fill="#e5e7eb">STORE</text>
  <text x="600" y="285" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="18" fill="#9ca3af" letter-spacing="2">UI Kits • Templates • Icons • Dev Tools</text>
  <rect x="540" y="300" width="120" height="2" rx="1" fill="#e4cb86">
    <animate attributeName="width" values="0;120;120" dur="2s" fill="freeze"/>
    <animate attributeName="x" values="600;540;540" dur="2s" fill="freeze"/>
  </rect>
</svg>
